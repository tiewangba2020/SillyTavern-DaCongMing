<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect width="680" height="340" fill="#FCFBF8"/>
  <text x="24" y="32" font-size="17" font-weight="700" fill="#303C36">置信度阈值扫描：采用率曲线（E12，N=40）</text>
  <text x="24" y="52" font-size="12" fill="#716B60">采用率 = confidence ≥ 阈值的决策占比；推荐阈值 0.4（拦下边界决策、不误伤正常决策）</text>

  <!-- 坐标区 x:90-620 y:80-280 ; y: 100%->90, 80%->146, 60%->202, 40%->258, 20%->280? 用线性 0-100: y=280-(v/100)*190 -->
  <!-- grid -->
  <line x1="90" y1="280" x2="620" y2="280" stroke="#D8D2C4"/>
  <line x1="90" y1="90"  x2="620" y2="90"  stroke="#E7E2D6"/>
  <line x1="90" y1="147" x2="620" y2="147" stroke="#E7E2D6"/>
  <line x1="90" y1="204" x2="620" y2="204" stroke="#E7E2D6"/>
  <line x1="90" y1="261" x2="620" y2="261" stroke="#E7E2D6"/>
  <text x="52" y="94"  font-size="11" fill="#716B60">100%</text>
  <text x="58" y="151" font-size="11" fill="#716B60">80%</text>
  <text x="58" y="208" font-size="11" fill="#716B60">60%</text>
  <text x="58" y="265" font-size="11" fill="#716B60">40%</text>

  <!-- x: 0.2->120, 0.3->220, 0.4->320, 0.5->420, 0.6->520, 0.7->620 -->
  <text x="108" y="302" font-size="12" fill="#303C36">0.2</text>
  <text x="208" y="302" font-size="12" fill="#303C36">0.3</text>
  <text x="308" y="302" font-size="12" fill="#303C36">0.4</text>
  <text x="408" y="302" font-size="12" fill="#303C36">0.5</text>
  <text x="508" y="302" font-size="12" fill="#303C36">0.6</text>
  <text x="608" y="302" font-size="12" fill="#303C36">0.7</text>
  <text x="330" y="326" font-size="12" fill="#716B60">置信度阈值</text>

  <!-- V1: 100,100,97.5,97.5,87.5,82.5 -> y=90,90,94.75,94.75,113.6,123.25 -->
  <polyline points="120,90 220,90 320,94.8 420,94.8 520,113.6 620,123.3" stroke="#716B60" stroke-width="2.5" fill="none"/>
  <circle cx="120" cy="90" r="4" fill="#716B60"/><circle cx="220" cy="90" r="4" fill="#716B60"/>
  <circle cx="320" cy="94.8" r="4" fill="#716B60"/><circle cx="420" cy="94.8" r="4" fill="#716B60"/>
  <circle cx="520" cy="113.6" r="4" fill="#716B60"/><circle cx="620" cy="123.3" r="4" fill="#716B60"/>
  <text x="96" y="80" font-size="11.5" fill="#716B60">V1 简洁指令</text>

  <!-- V2: 100,97.5,97.5,95,90,82.5 -> y=90,94.75,94.75,99.5,109,123.25 -->
  <polyline points="120,90 220,94.8 320,94.8 420,99.5 520,109 620,123.3" stroke="#C08A2E" stroke-width="2.5" fill="none"/>
  <circle cx="120" cy="90" r="4" fill="#C08A2E"/><circle cx="220" cy="94.8" r="4" fill="#C08A2E"/>
  <circle cx="320" cy="94.8" r="4" fill="#C08A2E"/><circle cx="420" cy="99.5" r="4" fill="#C08A2E"/>
  <circle cx="520" cy="109" r="4" fill="#C08A2E"/><circle cx="620" cy="123.3" r="4" fill="#C08A2E"/>
  <text x="430" y="88" font-size="11.5" font-weight="700" fill="#C08A2E">V2 精调指令</text>

  <!-- 推荐阈值竖线 -->
  <line x1="320" y1="80" x2="320" y2="280" stroke="#6F785A" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="248" y="74" font-size="11.5" font-weight="700" fill="#6F785A">推荐 0.4：采用 97.5%</text>
</svg>
