<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect width="680" height="380" fill="#FCFBF8"/>
  <text x="24" y="32" font-size="17" font-weight="700" fill="#303C36">上下文规模随聊天增长：关闭插件 vs 开启插件</text>
  <text x="24" y="52" font-size="12" fill="#716B60">模拟真实聊天语料 · y 轴为插件口径 token（对数刻度）· 实测点画圆点，推算段为虚线</text>

  <!-- 坐标区 x:80-620, y:70-300 ; log10 1e5->y292, 2e7->y84 -->
  <!-- gridlines -->
  <line x1="80" y1="292" x2="620" y2="292" stroke="#D8D2C4" stroke-width="1"/>
  <line x1="80" y1="225" x2="620" y2="225" stroke="#E7E2D6" stroke-width="1"/>
  <line x1="80" y1="158" x2="620" y2="158" stroke="#E7E2D6" stroke-width="1"/>
  <line x1="80" y1="91"  x2="620" y2="91"  stroke="#E7E2D6" stroke-width="1"/>
  <text x="30" y="296" font-size="11" fill="#716B60">100k</text>
  <text x="26" y="229" font-size="11" fill="#716B60">1M</text>
  <text x="22" y="162" font-size="11" fill="#716B60">10M</text>
  <text x="22" y="95"  font-size="11" fill="#716B60">100M</text>

  <!-- x labels -->
  <text x="140" y="318" font-size="12" fill="#303C36">100 楼</text>
  <text x="340" y="318" font-size="12" fill="#303C36">500 楼</text>
  <text x="545" y="318" font-size="12" fill="#303C36">2000 楼</text>

  <!-- 关闭插件: (100,1.376M)->x180,y218 ; (500,~5.0M)->x380,y143 ; (2000,19.99M)->x600,y84 -->
  <polyline points="180,218 380,143" stroke="#B4533A" stroke-width="2.5" fill="none"/>
  <polyline points="380,143 600,84" stroke="#B4533A" stroke-width="2.5" fill="none" stroke-dasharray="1 0"/>
  <circle cx="180" cy="218" r="4.5" fill="#B4533A"/>
  <circle cx="600" cy="84" r="4.5" fill="#B4533A"/>
  <text x="608" y="80" font-size="12" font-weight="700" fill="#B4533A">≈20.0M</text>
  <text x="96" y="212" font-size="11.5" fill="#B4533A">1.38M</text>
  <text x="388" y="138" font-size="11.5" fill="#B4533A">≈5.0M</text>

  <!-- 开启·1M 档: (2000,651.9k)->x600,y237 ; 500 楼起平缓 (虚线推算) -->
  <polyline points="380,252 600,237" stroke="#6F785A" stroke-width="2.5" fill="none" stroke-dasharray="5 4"/>
  <circle cx="600" cy="237" r="4.5" fill="#6F785A"/>
  <text x="540" y="260" font-size="12" font-weight="700" fill="#6F785A">652k（实测）</text>

  <!-- 开启·128k 档: 近乎平直 ~115k: (100,115k)->x180,y289 ; (500,114.8k)->x380,y289 ; (2000,114.8k)->x600,y289 -->
  <polyline points="180,289 380,289 600,289" stroke="#C08A2E" stroke-width="2.5" fill="none"/>
  <circle cx="380" cy="289" r="4.5" fill="#C08A2E"/>
  <circle cx="600" cy="289" r="4.5" fill="#C08A2E"/>
  <text x="608" y="293" font-size="12" font-weight="700" fill="#C08A2E">115k</text>

  <!-- 图例 -->
  <rect x="80" y="338" width="12" height="4" fill="#B4533A"/><text x="98" y="343" font-size="11.5" fill="#303C36">关闭插件（全量原文）</text>
  <rect x="240" y="338" width="12" height="4" fill="#C08A2E"/><text x="258" y="343" font-size="11.5" fill="#303C36">开启 · 128k 档（500/2000 楼为实测）</text>
  <rect x="480" y="338" width="12" height="4" fill="#6F785A"/><text x="498" y="343" font-size="11.5" fill="#303C36">开启 · 1M 档</text>
</svg>
